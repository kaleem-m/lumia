<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTL check</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="brand__mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand__text"><strong>Lexio</strong><small>your words, your pace</small></span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main"></nav>
    <div class="sidebar__foot">
      <div class="storage-note"><span class="storage-note__dot"></span>
      <p>Everything is stored only in this browser.</p></div>
    </div>
  </aside>
  <div class="content">
    <header class="topbar" id="topbar">
      <div class="topbar__inner">
        <div class="topbar__brand">
          <span class="brand__mark brand__mark--sm" id="brand-mark-mobile"></span>
          <span class="topbar__title" id="topbar-title">Lexio</span>
        </div>
        <div class="topbar__actions">
          <button type="button" class="chip account-button" id="account-button" aria-haspopup="dialog" aria-label="Sign in or create an account">
            <span class="chip__icon" id="account-icon" aria-hidden="true"></span>
            <span class="chip__label" id="account-label">Sign in</span>
          </button>
          <button type="button" class="chip chip--lang" id="lang-chip" aria-haspopup="dialog">
            <span class="chip__icon" id="lang-chip-icon"></span>
            <span class="chip__label" id="lang-chip-label">Language</span>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle"><span id="theme-toggle-icon"></span></button>
        </div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/icons.js"></script>
<script src="js/categories.js"></script>
<script src="js/store.js"></script>
<script src="js/scheduler.js"></script>
<script>
/* Seed an RTL language with Arabic words BEFORE the app boots, so the grid
   renders populated cards with Arabic content inside an RTL interface. */
(function () {
  Store.resetAll();
  var lang = Store.addLanguage({ name: 'العربية', dir: 'rtl' });
  /* Tuple: [category, term, meaning, nativeScript?] — the last field lets a
     couple of entries demonstrate the optional second line of the pair card. */
  var seed = [
    ['colors', 'أحمر', 'red', ''],
    ['colors', 'أزرق', 'blue', ''],
    ['colors', 'أخضر', 'green', ''],
    ['greetings', 'marhaba', 'hello', 'مرحبا'],
    ['greetings', 'شكرا', 'thank you', ''],
    ['verbs', 'يكتب', 'to write', ''],
    ['family', 'أم', 'mother', '']
  ];
  /* Add through the store so every entry gets the normalized shape
     (including learning stats) the scheduler expects. */
  var added = seed.map(function (s) {
    return Store.addWord({
      languageId: lang.id, categoryId: s[0],
      term: s[1], meaning: s[2], nativeScript: s[3] || '', dir: 'rtl'
    });
  });
  Store.state.progress[added[0].id] = { box: 3, seen: 4, correct: 4, lastSeen: Date.now() };
  Store.state.progress[added[3].id] = { box: 3, seen: 4, correct: 5, lastSeen: Date.now() };
  Store.state.sessions.push({ at: Date.now(), correct: 4, total: 5 });
})();
</script>
<script src="js/ui.js"></script>
<script src="js/cloud.js"></script>
<script src="js/word-display.js"></script>
<script src="js/activities/registry.js"></script>
<script src="js/activities/flashcards.js"></script>
<script src="js/activities/quiz.js"></script>
<script src="js/activities/match.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/category.js"></script>
<script src="js/views/learn.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/manage.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>

</html>
